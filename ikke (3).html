<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>CASINO KING - 3 IKKE</title><style>
:root{color-scheme:dark;--g:#e8b947;box-sizing:border-box}*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:#030201;color:#fff;font-family:Georgia,'Noto Sans','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Bengali',serif;display:grid;place-items:center;overflow:hidden}
.st{position:relative;width:min(100vw,200vh);aspect-ratio:2/1;container-type:inline-size;font-size:1.6cqw;background:#050302;overflow:hidden}
.a{position:absolute}.c{transform:translate(-50%,-50%)}
.bx{background:linear-gradient(#14100c,#020202);border:.12cqw solid #d4a437;border-radius:.8cqw;box-shadow:inset 0 .1cqw .25cqw #ffffff22,0 .25cqw .7cqw #000c}
.tbl{left:19%;top:12%;width:62%;height:auto;filter:drop-shadow(0 1cqw 1.2cqw #000)}
.b{font:inherit;color:#fff;cursor:pointer;display:flex;align-items:center;gap:.6cqw;line-height:1.15;padding:.3cqw .9cqw;text-align:left}.b:active{transform:scale(.97)}
.b small{display:block;font-size:.72em;opacity:.9}.b b{font-weight:400;font-size:1.1em}.b i{font-style:normal}
.v2{flex-direction:column;align-items:flex-start;justify-content:center;gap:0}
.g1{background:linear-gradient(#2f7a38,#124d1a);border-color:#6fc47a}.o1{background:linear-gradient(#c8541a,#7a2c08);border-color:#f0a070}.p1{background:linear-gradient(#5b2aa6,#2c1060);border-color:#a98bd8}
.ib{top:2%;width:6.6%;height:9.5%;flex-direction:column;justify-content:center;align-items:center;gap:0;font-size:.95cqw;padding:0;text-align:center}.ib i{font-size:2.1cqw}
.av{width:5.6cqw;height:5.6cqw;border-radius:50%;border:.3cqw solid #d4a437;background:radial-gradient(#6a5a4a,#1a1410);display:grid;place-items:center;font-size:3cqw;box-shadow:0 .2cqw .6cqw #000;flex:none}
.seat{display:flex;align-items:center;gap:.3cqw}.seat.r{flex-direction:row-reverse}.on .av{animation:pulse 1s infinite}
.inf{text-align:center;padding:.2cqw .8cqw;min-width:7.6cqw;font-size:.95cqw;line-height:1.25}.inf i{font-style:normal;color:var(--g);display:block;font-size:1.1em}
.bd{display:block;margin-top:.15cqw;border-radius:.4cqw;font-size:.8em;background:#0f4aa0;border:.1cqw solid #4a8ef0}.bd.s{background:#1f7a2e;border-color:#52d067}
.fan{display:flex}.cb{width:3.4cqw;height:4.8cqw;border-radius:.4cqw;margin-left:-1.7cqw;box-shadow:0 .15cqw .4cqw #000a;border:.12cqw solid #fff;background-clip:padding-box}
.fan .cb:nth-child(1){transform:rotate(-9deg)}.fan .cb:nth-child(3){transform:rotate(9deg)}
#mf{gap:.9cqw}#mf .cb,#mf .cb:nth-child(n){width:6.6cqw;height:9.2cqw;margin-left:0;transform:none}#mf{cursor:pointer}
.fan.dl{animation:deal .6s cubic-bezier(.2,.8,.3,1) var(--d,0s) both}
.pl{display:flex;align-items:center;gap:.3cqw;background:#000b;border-radius:2cqw;padding:.1cqw .8cqw .1cqw .2cqw;font-size:.95cqw}
.ch{width:1.9cqw;height:1.9cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#d42a2a 55%,#8e1010);border:.22cqw dashed #fff;display:inline-block;box-shadow:0 .1cqw .25cqw #000}.fl{position:absolute;z-index:4;pointer-events:none}
.q{background:#05070c;border:.12cqw solid #d4a437;border-radius:.6cqw;color:#fff;font:inherit;padding:.6cqw 1.2cqw;cursor:pointer}
.ov{position:absolute;inset:0;background:#000b;display:none;place-items:center;z-index:8}.ov.v{display:grid}
.mc{padding:1.4cqw 2.4cqw;width:46%;max-height:92%;overflow:auto;font-size:1.25cqw;text-align:center;display:grid;gap:.9cqw}.mc h3{color:var(--g);font-weight:400;font-size:1.6em}
.lg{display:flex;gap:.7cqw;flex-wrap:wrap;justify-content:center}.lg .q.on{background:#5b2aa6;border-color:#a98bd8}
.pk{display:flex;justify-content:space-between;align-items:center;gap:1cqw;padding:.6cqw 1cqw}.wa{display:inline-block;background:linear-gradient(#25d366,#128c4a);color:#fff;text-decoration:none;border-radius:.7cqw;padding:.7cqw 1.4cqw;border:.12cqw solid #9af0b8}
#sh{position:absolute;left:24%;width:52%;bottom:0;padding:1.2cqw 2cqw;z-index:7;display:none;text-align:center;gap:.8cqw;font-size:1.3cqw}#sh.v{display:grid}
#win{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;z-index:9;background:radial-gradient(circle,#ffd54a77,#0000 62%);overflow:hidden}#win.v{display:grid}
.coin{position:absolute;top:-6cqw;font-style:normal;font-size:3cqw;animation:fall 2.6s linear forwards}#wb{padding:1cqw 4cqw;text-align:center;font-size:2.2cqw;color:var(--g);animation:pop .5s}
.t{position:absolute;pointer-events:none;left:50%;top:60%;transform:translateX(-50%);background:#000d;border:.12cqw solid var(--g);border-radius:.8cqw;padding:.5cqw 1.6cqw;opacity:0;transition:opacity .3s;z-index:6;font-size:1.3cqw}.t.v{opacity:1}
#rot{position:fixed;inset:0;background:#000;display:none;place-items:center;text-align:center;z-index:99;font-size:6vw;padding:8vw;color:var(--g)}@media(orientation:portrait){#rot{display:grid}}
.bk{animation:tw 3.2s ease-in-out infinite alternate}@keyframes tw{from{opacity:.25}to{opacity:.8}}
@keyframes deal{from{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(200deg);opacity:0}to{transform:none;opacity:1}}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}@keyframes pulse{0%,100%{box-shadow:0 0 .8cqw .4cqw #ffd54a}50%{box-shadow:0 0 1.8cqw 1cqw #ffd54a}}
@keyframes fall{to{transform:translateY(60cqw) rotate(540deg)}}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.bk,.fan.dl,.cb.up,.coin,#wb,.on .av{animation:none}}
