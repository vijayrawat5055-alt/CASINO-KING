<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no"><title>Statement</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box;margin:0}body{background:#0b0404;color:#fff;font-family:Georgia,serif;padding:14px}
.w{max-width:760px;margin:auto;display:grid;gap:12px}h1{color:#e2b04a}a{color:#e2b04a}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:7px 6px;border-bottom:1px solid #3a2a20;text-align:left}th{color:#e2b04a}
.p{color:#7f7}.m{color:#f88}.n{text-align:right}html,body{touch-action:pan-x pan-y;overscroll-behavior:none}</style></head><body><div class="w">
<div style="display:flex;justify-content:space-between;align-items:center"><h1>Statement</h1><a href="/">Back to lobby</a></div>
<div>Balance: <b id="bal">0</b> coins</div><div id="err" role="alert" style="color:#f88"></div>
<table><thead><tr><th>Date</th><th>Game</th><th>Details</th><th class="n">Coins</th><th class="n">Balance</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
let t;try{t=localStorage.getItem('t3')}catch{}if(!t)location.href='/';
const L={bet:'Bet',win:'Win',admin_add:'Coins added',admin_cut:'Coins removed'},f=n=>n.toLocaleString('en-IN'),e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
fetch('/api/statement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t})}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{
 document.getElementById('bal').textContent=f(d.bal);
 document.getElementById('rows').innerHTML=d.items.length?d.items.map(i=>`<tr><td>${new Date(i.t).toLocaleString('en-IN')}</td><td>${e(i.game)}</td><td>${L[i.type]||i.type} ${e(i.note)}</td><td class="n ${i.amt>0?'p':'m'}">${i.amt>0?'+':''}${f(i.amt)}</td><td class="n">${f(i.bal)}</td></tr>`).join(''):'<tr><td colspan="5">No entries yet.</td></tr>'
}).catch(()=>{document.getElementById('err').textContent='Please log in again.'});
</script></body></html>
